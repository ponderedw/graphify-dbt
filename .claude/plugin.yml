name: dbt-graphify
description: dbt lineage graph queries, watch process, and snapshot history
trigger: /dbt-graphify
version: "1.0"

skill:
  source: .claude/skills/dbt-graphify/SKILL.md
  install_to: dbt-graphify

mcp:
  name: dbt-graphify
  transport: docker
  image: pondered/dbt-graphify-mcp:latest
  env:
    optional:
      - name: S3_PATH
        description: "S3 path for snapshot storage, e.g. s3://my-bucket/my-project"
      - name: AWS_ACCESS_KEY_ID
        description: "AWS credentials for S3 access"
      - name: AWS_SECRET_ACCESS_KEY
        description: "AWS credentials for S3 access"
      - name: AWS_DEFAULT_REGION
        default: us-east-1
      - name: LOCAL_GRAPHIFY
        description: "Set to 'true' to use local graphify-out/ instead of S3"
  volumes:
    - name: dbt-graphify-cache
      mount: /root/.cache/dbt-graphify

claude_md: |
  # dbt-graphify
  - **dbt-graphify** (`~/.claude/skills/dbt-graphify/SKILL.md`) - dbt lineage graph queries and watch process. Trigger: `/dbt-graphify`
  When the user types `/dbt-graphify`, use the installed dbt-graphify skill before doing anything else.
